problem:
  en: "Misr El Kheir's social researchers document each debtor's case (personal data, family members, housing) in long multi-step forms, and the app must not lose an entry when the connection drops."
  de: "Die Sozialforscher von Misr El Kheir dokumentieren jeden Fall (persönliche Daten, Familienmitglieder, Wohnsituation) in langen mehrstufigen Formularen, und die App darf keinen Eintrag verlieren, wenn die Verbindung abbricht."
  ar: "يوثّق الباحثون الاجتماعيون في مصر الخير حالة كل غارم (البيانات الشخصية وأفراد الأسرة والسكن) في نماذج طويلة متعددة الخطوات، ويجب ألا يضيع أي إدخال إذا انقطع الاتصال."
built:
  en: "My part was the offline queue for family members: a family-member request made without a connection is saved to a local SQLite queue, a connectivity listener notices when the network is back, and a sync service sends the queued requests and updates the screen."
  de: "Mein Teil war die Offline-Warteschlange für Familienmitglieder: Eine Anfrage ohne Verbindung wird in einer lokalen SQLite-Warteschlange gespeichert, ein Verbindungs-Listener erkennt, wenn das Netz zurück ist, und ein Sync-Dienst sendet die wartenden Anfragen und aktualisiert die Ansicht."
  ar: "كان دوري قائمة الانتظار دون اتصال لأفراد الأسرة: يُحفظ الطلب الذي يُرسل دون اتصال في قائمة SQLite محلية، ويلاحظ مستمع الاتصال عودة الشبكة، ثم ترسل خدمة المزامنة الطلبات المنتظرة وتحدّث الشاشة."
result:
  en: "Family members can be recorded with no connection; the records reach the server once the phone is back online."
  de: "Familienmitglieder lassen sich ohne Verbindung erfassen; die Daten erreichen den Server, sobald das Telefon wieder online ist."
  ar: "يمكن تسجيل أفراد الأسرة دون اتصال، وتصل البيانات إلى الخادم فور عودة الهاتف إلى الإنترنت."
