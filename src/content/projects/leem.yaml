problem:
  en: "Universities and research bodies, mainly in Saudi Arabia, want their own branded library app: sign-in through the institution, search across what the library offers, and Arabic and English as equals, not a translation."
  de: "Hochschulen und Forschungseinrichtungen, vor allem in Saudi-Arabien, wollen eine eigene Bibliotheks-App: Anmeldung über die Einrichtung, Suche in ihrem Angebot, und Arabisch und Englisch gleichwertig statt übersetzt."
  ar: "تريد الجامعات والجهات البحثية، في السعودية أساسًا، تطبيق مكتبة يحمل هويتها: دخول عبر المؤسسة، وبحث في ما تقدّمه المكتبة، والعربية والإنجليزية متكافئتان لا ترجمة."
built:
  en: "I revamped the React Native app (four tabs, designed covers, a reading timer with a daily goal) and made sign-in solid: a Keychain session per institution, a two-factor step, and sign-out that revokes the token on the server. Also a native PDF viewer, paged search, notification settings and an EAS build for TestFlight."
  de: "Ich habe die React-Native-App überarbeitet (vier Tabs, gestaltete Cover, ein Lese-Timer mit Tagesziel) und die Anmeldung solide gemacht: eine Keychain-Sitzung pro Einrichtung, ein Zwei-Faktor-Schritt und eine Abmeldung, die das Token auf dem Server widerruft. Dazu ein nativer PDF-Viewer, seitenweise Suche, Benachrichtigungseinstellungen und ein EAS-Build für TestFlight."
  ar: "أعدتُ تصميم تطبيق React Native (أربع علامات تبويب، وأغلفة مصمّمة، ومؤقّت قراءة بهدف يومي)، وأحكمتُ تسجيل الدخول: جلسة في Keychain لكل مؤسسة، وخطوة تحقق ثنائي، وتسجيل خروج يُلغي الرمز على الخادم. إضافةً إلى عارض PDF أصلي، وبحث على صفحات، وإعدادات للإشعارات، وبناء EAS لـTestFlight."
result:
  en: "Version 0.1.1 built for TestFlight and as an Android APK in October 2026."
  de: "Version 0.1.1 im Oktober 2026 für TestFlight und als Android-APK gebaut."
  ar: "بُني الإصدار 0.1.1 لـTestFlight وكملف APK لأندرويد في أكتوبر 2026."
