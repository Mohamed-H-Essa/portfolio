  de: "Ich habe im Team an der React-Native-App (Expo) gearbeitet: Chat und Diktat, der Voice-Raum, Reels, Podcasts (Wiedergabe, MP3-Download, Transkripte), Lernpläne, die Arena-Lobby, Tarif & Abrechnung, Google-Anmeldung, Android-Layoutfehler und eine Übersetzungsrunde über die 12 Sprachen der App."
  ar: "عملتُ مع الفريق على تطبيق React Native (Expo): المحادثة والإملاء الصوتي، وغرفة الصوت، والمقاطع القصيرة، والبودكاست (تشغيل وتنزيل MP3 ونصوص)، وخطط المذاكرة، وردهة Arena، والخطط والفواتير، وتسجيل الدخول بـGoogle، وإصلاحات واجهة Android، ومراجعة الترجمة في لغات التطبيق الاثنتي عشرة."
