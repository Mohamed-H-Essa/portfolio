problem:
  en: "In Egypt's property market, buyers want to search listings and reach the seller directly, without middlemen, and developers and sales agents need serious leads to land straight on their phones."
  de: "Auf dem ägyptischen Immobilienmarkt wollen Käufer Angebote durchsuchen und Verkäufer direkt erreichen, ohne Vermittler, und Bauträger und Makler brauchen ernsthafte Anfragen direkt auf dem Handy."
  ar: "في سوق العقارات المصري، يريد المشترون البحث في العروض والتواصل مع البائع مباشرة دون وسطاء، ويحتاج المطوّرون ومسوّقو العقارات إلى عملاء جادّين يصلونهم مباشرة على هواتفهم."
built:
  en: "Two React Native / Expo apps, Arabic-first with full RTL: Bioot for buyers (search, map, favourites, an AI advisor, in-app calls and chat) and Bioot Partners for developers (listings, leads, analytics). I took both through store readiness and release: Expo SDK 54 for Android's 16 KB pages, Play policy fixes, App Store resubmission, signing."
  de: "Zwei React-Native-/Expo-Apps, Arabisch zuerst mit vollem RTL: Bioot für Käufer (Suche, Karte, Favoriten, KI-Berater, Anrufe und Chat) und Bioot Partners für Bauträger (Angebote, Leads, Analysen). Ich habe beide store-reif gemacht und veröffentlicht: Expo SDK 54 für 16-KB-Seiten, Play-Richtlinien, App-Store-Neueinreichung, Signierung."
  ar: "تطبيقان بـ React Native / Expo بالعربية أولاً ودعم كامل للاتجاه من اليمين: بيوت للمشترين (بحث وخريطة ومفضلة ومستشار ذكي ومكالمات ومحادثات) وبيوت للشركاء للمطوّرين (عقارات وعملاء محتملون وتحليلات). تولّيت تجهيزهما للمتاجر ونشرهما: Expo SDK 54 لصفحات 16 كيلوبايت، وسياسات Play، وإعادة التقديم لـ App Store، والتوقيع."
result:
