# Copy to <slug>.yaml. Files starting with "_" are ignored by the content loader.
# Localized fields: `en` is required; `de`/`ar` fall back to en with a build warning.
slug: example-app
kind: project                 # project | role | cert
worlds: [mobile]              # any of: mobile, cloud, origin  (first one = primary lane on the map)
era: s3                       # s1 origins 2019-21 | s2 freelance 2022-24 | s3 intrazero 2024- | s4 cloud 2026-
start: 2025-01                # YYYY-MM, positions the node on the timeline
end: 2025-06                  # or "present"
weight: { mobile: 3, cloud: 0, all: 2 }   # 0 = dimmed on that track, 3 = featured candidate
featured: false               # at most one featured per track
confidential: false
code: M-03                    # Dark-style case code: M/C/O + 2 digits, unique
role: { en: "Lead Flutter developer" }
title: { en: "Example App", de: "Example App", ar: "تطبيق مثال" }
impact:
  line: { en: "Cut release cycles from days to same-day" }
  metric: { value: "", label: { en: "" } }    # leave empty unless stated by owner / provable
problem: { en: "≤ 60 words." }
built:   { en: "≤ 60 words." }
result:  { en: "≤ 60 words." }
stack: [Flutter, Bloc, Firebase, GitHub Actions]
links:                        # all optional
  appStore: ""
  playStore: ""
  github: ""
  live: ""
connects: []                  # slugs this node draws an edge to, e.g. [release-pipeline, aratc-aws]
assets: auto                  # auto = public/projects/<slug>/ generated by `npm run assets`
review: { de: true, ar: true }   # true until the owner approves the translation
