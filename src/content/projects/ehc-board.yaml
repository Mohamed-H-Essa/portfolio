problem:
  en: "Medical trainees in the Egyptian Health Council and Ministry of Health programmes have to log their cases, procedures and milestones, and fill in the council's forms and surveys, wherever they are working."
  de: "Ärztinnen und Ärzte in den Weiterbildungsprogrammen des Gesundheitsrats und des Ministeriums müssen Fälle, Eingriffe und Meilensteine dokumentieren und Formulare des Rats ausfüllen – dort, wo sie gerade arbeiten."
  ar: "يحتاج المتدرّبون في برامج المجلس الصحي المصري ووزارة الصحة إلى تسجيل حالاتهم وإجراءاتهم ومراحل تدريبهم، وتعبئة نماذج المجلس واستبياناته أينما كانوا يعملون."
built:
  en: "A Flutter app with a trainee dashboard, a logbook with multi-step case entry, dynamic surveys and forms (many question types, attachments, multi-step), news and push notifications, in Arabic and English with RTL/LTR switching. One codebase runs in both EHC and MOHP modes."
  de: "Eine Flutter-App mit Dashboard, Logbuch mit mehrstufiger Falleingabe, dynamischen Umfragen und Formularen (viele Fragetypen, Anhänge, mehrstufig), News und Push-Benachrichtigungen, auf Arabisch und Englisch mit RTL/LTR-Wechsel. Eine Codebasis für den EHC- und den MOHP-Modus."
  ar: "تطبيق Flutter بلوحة متابعة للمتدرّب، وسجلّ عمل بإدخال حالات متعدد الخطوات، واستبيانات ونماذج ديناميكية (أنواع أسئلة متعددة ومرفقات وخطوات)، وأخبار وإشعارات فورية، بالعربية والإنجليزية مع تبديل الاتجاه. قاعدة كود واحدة تعمل بوضعَي المجلس الصحي ووزارة الصحة."
