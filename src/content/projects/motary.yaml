problem:
  en: "Car owners need the right part for their car from many parts sellers, and the sellers need one place to list their parts and handle orders."
  de: "Autobesitzer suchen das passende Teil für ihr Auto bei vielen Händlern, und die Händler brauchen einen Ort, um ihre Teile anzubieten und Bestellungen abzuwickeln."
  ar: "يبحث أصحاب السيارات عن القطعة المناسبة لسياراتهم لدى بائعين كثيرين، ويحتاج البائعون إلى مكان واحد يعرضون فيه قطعهم ويديرون طلباتهم."
built:
  en: "A Flutter app with a buyer side (search, sellers, categories, part details with compatibility, cart) and a seller side. I built the seller's catalogue: product listings by category with pagination and show/hide, and the step-by-step add and edit product flow with multiple images. Arabic and English; Google, Apple and Facebook sign-in."
  de: "Eine Flutter-App mit Käuferseite (Suche, Händler, Kategorien, Teiledetails mit Kompatibilität, Warenkorb) und Händlerseite. Ich habe den Katalog der Händler gebaut: Produktlisten nach Kategorie mit Paginierung und Ein-/Ausblenden sowie das mehrstufige Anlegen und Bearbeiten von Produkten mit mehreren Bildern. Arabisch und Englisch; Anmeldung mit Google, Apple und Facebook."
  ar: "تطبيق Flutter بواجهة للمشتري (بحث، بائعون، فئات، تفاصيل القطعة وتوافقها، سلة) وواجهة للبائع. بنيتُ كتالوج البائع: قوائم المنتجات حسب الفئة مع التقسيم إلى صفحات والإظهار والإخفاء، وإضافة المنتج وتعديله خطوة بخطوة مع صور متعددة. بالعربية والإنجليزية، مع تسجيل الدخول عبر Google وApple وFacebook."
