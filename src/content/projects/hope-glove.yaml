problem:
  en: "A hand-rehabilitation idea needed the whole stack built at once: a wearable that measures finger motion, a patient/practitioner app, and a backend to score sessions and store recordings."
  de: "Eine Hand-Reha-Idee brauchte den ganzen Stack auf einmal: ein Wearable, das Fingerbewegung misst, eine Patienten-/Behandler-App und ein Backend, das Sitzungen bewertet und Aufnahmen speichert."
  ar: "فكرة لإعادة تأهيل اليد احتاجت بناء المنظومة كاملة دفعة واحدة: جهاز يقيس حركة الأصابع، وتطبيق للمريض والمعالج، وخلفية تقيّم الجلسات وتخزّن التسجيلات."
built:
  en: "An ESP32 glove (flex sensors + MPU6050) streaming over HTTPS to API Gateway; Python Lambdas that batch sensor data and score assessment and exercise; DynamoDB for sessions and S3 for video; and a Flutter patient/practitioner app. One scripted deploy stands up every resource in eu-west-3."
  de: "Ein ESP32-Handschuh (Flex-Sensoren + MPU6050), der per HTTPS an API Gateway sendet; Python-Lambdas, die Sensordaten bündeln und Assessment sowie Übung bewerten; DynamoDB für Sitzungen, S3 für Videos; dazu eine Flutter-App für Patient und Behandler. Ein Skript-Deploy erstellt alle Ressourcen in eu-west-3."
  ar: "قفاز ESP32 (حسّاسات انثناء + MPU6050) يبثّ عبر HTTPS إلى API Gateway؛ ودوال Lambda بلغة Python تجمع بيانات الحسّاسات على دفعات وتحتسب درجات التقييم والتمارين؛ وDynamoDB للجلسات وS3 للفيديو؛ وتطبيق Flutter للمريض والمعالج. سكربت نشر واحد يُنشئ كل الموارد في eu-west-3."
result:
  en: "A working end-to-end demo: glove to cloud to app, with scoring, recorded exercises, and a practitioner view — plus clean teardown scripts for a cost-aware single-region footprint."
  de: "Eine funktionierende End-to-End-Demo: vom Handschuh über die Cloud zur App, mit Bewertung, aufgezeichneten Übungen und Behandler-Ansicht — samt sauberen Teardown-Skripten für einen kostenbewussten Betrieb in einer einzigen AWS-Region."
  ar: "عرض متكامل يعمل: من القفاز إلى السحابة إلى التطبيق، مع التقييم وتسجيل التمارين وواجهة للمعالج — إضافة إلى سكربتات إزالة نظيفة تُبقي التكلفة منخفضة في منطقة AWS واحدة."
